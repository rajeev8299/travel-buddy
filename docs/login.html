<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="logo.png" />

    <link rel="manifest" href="manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Log in to TravelOnBuddy — pick up your saved trips, draft plans, and buddy chats." />

    <!-- Search & social -->
    <meta name="robots" content="noindex, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TravelOnBuddy" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Log In — TravelOnBuddy" />
    <meta property="og:description" content="Log in to TravelOnBuddy — pick up your saved trips, draft plans, and buddy chats." />
    <meta property="og:url" content="https://rajeev8299.github.io/travel-buddy/login.html" />
    <meta property="og:image" content="https://rajeev8299.github.io/travel-buddy/img/riverfront.jpg" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1440" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Log In — TravelOnBuddy" />
    <meta name="twitter:description" content="Log in to TravelOnBuddy — pick up your saved trips, draft plans, and buddy chats." />
    <meta name="twitter:image" content="https://rajeev8299.github.io/travel-buddy/img/riverfront.jpg" />
    <meta name="theme-color" content="#3F2617" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Log In — TravelOnBuddy</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="page">
      <div id="site-header"></div>

      <main>
        <div
          id="page-header-slot"
          data-eyebrow="Log in"
          data-title="Welcome back"
          data-intro="Pick up where you left off — your saved trips, draft plans and the buddies you've been chatting with are all here."
          data-image="img/riverfront.jpg"
          data-pos="center 55%"
        ></div>

        <section class="section">
          <div class="shell auth__shell" data-reveal>
            <div id="auth-form-slot"></div>
          </div>
        </section>
      </main>

      <div id="site-footer"></div>
    </div>

    <script src="js/util.js"></script>
    <script src="js/api.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/page-header.js"></script>
    <script src="js/auth.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        initReveal();
        initAuthForm("login");
      });
    </script>
    <script src="js/pwa.js"></script>
  </body>
</html>
