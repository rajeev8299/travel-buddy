<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="apple-touch-icon" href="logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Trips that went sideways and got better for it — told by the travellers they happened to." />
    <meta name="theme-color" content="#3F2617" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Stories — TravelOnBuddy</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="page">
      <div id="site-header"></div>

      <main>
        <div
          id="page-header-slot"
          data-eyebrow="Stories"
          data-title="Trips that went sideways and got better for it"
          data-intro="Told by the travellers they happened to. We don't edit out the parts where the plan fell apart — those are usually the point."
          data-image="img/alleppey.jpg"
          data-pos="center 48%"
        ></div>

        <section class="section section--dark">
          <div class="shell stories" id="stories-shell">
            <div id="stories-carousel"></div>
          </div>
        </section>

        <section class="section">
          <div class="shell">
            <header class="section__head" data-reveal>
              <div>
                <p class="eyebrow eyebrow--dark">All of them</p>
                <h2>Every story, in full</h2>
              </div>
            </header>

            <div class="grid grid--features" id="stories-grid"></div>
          </div>
        </section>
      </main>

      <div id="site-footer"></div>
    </div>

    <script src="js/util.js"></script>
    <script src="js/api.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/page-header.js"></script>
    <script src="js/stories.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => initReveal());
    </script>
  </body>
</html>
