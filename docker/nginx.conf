server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Public site (docs/) at /, admin panel (dist/, hash-routed) at /admin/.
  location / {
    try_files $uri $uri/ /404.html;
  }

  # The admin panel must never be framed by another site (clickjacking its
  # approve/delete buttons). add_header in a location replaces the server-
  # level ones, so they're repeated here.
  location /admin/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    try_files $uri $uri/ /admin/index.html;
  }
}
