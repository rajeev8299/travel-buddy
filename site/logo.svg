<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="TravelOnBuddy">
  <title>TravelOnBuddy</title>

  <defs>
    <clipPath id="tob-scene">
      <circle cx="200" cy="150" r="120" />
    </clipPath>
    <linearGradient id="tob-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9AE44" />
      <stop offset="100%" stop-color="#EF8C17" />
    </linearGradient>
    <linearGradient id="tob-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FAEE2" />
      <stop offset="100%" stop-color="#2A7FBF" />
    </linearGradient>
    <linearGradient id="tob-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D5D5D5" />
    </linearGradient>
    <linearGradient id="tob-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBDCBB" />
      <stop offset="100%" stop-color="#EFBB8E" />
    </linearGradient>
  </defs>

  <!-- medallion rings -->
  <circle cx="200" cy="150" r="142" fill="#FFFFFF" />
  <circle cx="200" cy="150" r="136" fill="#4A2A15" />
  <circle cx="200" cy="150" r="126" fill="#FFFFFF" />

  <g clip-path="url(#tob-scene)">
    <rect x="70" y="20" width="260" height="152" fill="url(#tob-sky)" />
    <rect x="70" y="172" width="260" height="112" fill="url(#tob-sea)" />

    <g fill="#FFFFFF">
      <ellipse cx="107" cy="70" rx="16" ry="7.5" />
      <ellipse cx="118" cy="65" rx="10" ry="6" />
      <ellipse cx="292" cy="68" rx="18" ry="8.5" />
      <ellipse cx="281" cy="63" rx="11" ry="6.5" />
      <ellipse cx="296" cy="104" rx="13" ry="6" />
      <ellipse cx="287" cy="100" rx="8" ry="4.5" />
    </g>

    <!-- mountains, kept left of the head so they stay visible -->
    <path d="M56 176 L96 106 L136 176 Z" fill="#2A7FBF" />
    <path d="M96 106 L110 130 Q103 124 96 130 Q89 124 82 130 Z" fill="#FFFFFF" />
    <path d="M104 176 L140 122 L176 176 Z" fill="#3E9AD6" />
    <path d="M140 122 L152 141 Q146 136 140 141 Q134 136 128 141 Z" fill="#FFFFFF" />

    <g fill="#FFFFFF" opacity=".3">
      <rect x="252" y="212" width="44" height="4" rx="2" />
      <rect x="270" y="228" width="32" height="4" rx="2" />
    </g>

    <!-- aeroplane, to the right of the head -->
    <g fill="#FFFFFF" stroke="#4A2A15" stroke-width="2.4" stroke-linejoin="round">
      <path d="M252 194 Q270 184 302 184 L314 189 L302 194 Q270 201 252 194 Z" />
      <path d="M270 188 L262 171 L273 171 L286 187 Z" />
      <path d="M255 192 L246 179 L254 179 L264 189 Z" />
      <path d="M300 187 L312 180 L318 183 L310 188 Z" />
    </g>

    <!-- the buddy -->
    <g stroke="#4A2A15" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M104 296 Q112 210 200 202 Q288 210 296 296 Z" fill="#A8845C" />
      <path d="M176 208 L200 250 L224 208 Q212 199 200 199 Q188 199 176 208 Z" fill="#5BAEE0" />
      <path d="M200 222 L210 238 L200 252 L190 238 Z" fill="#3E8FC4" stroke="none" />
      <path d="M152 296 L136 216 Q147 203 163 212 L173 296 Z" fill="#F2921D" stroke-width="3.4" />
      <path d="M248 296 L264 216 Q253 203 237 212 L227 296 Z" fill="#F2921D" stroke-width="3.4" />
      <ellipse cx="157" cy="124" rx="9" ry="13" fill="url(#tob-skin)" />
      <ellipse cx="243" cy="124" rx="9" ry="13" fill="url(#tob-skin)" />
      <ellipse cx="200" cy="120" rx="46" ry="51" fill="url(#tob-skin)" />
      <path d="M154 114 Q147 62 200 58 Q253 62 246 114 Q239 87 220 80 Q200 73 180 82 Q161 90 154 114 Z" fill="url(#tob-hair)" />
      <path d="M181 144 Q200 166 219 144 Q200 153 181 144 Z" fill="#FFFFFF" stroke-width="3.4" />
    </g>

    <g stroke="#BEBEBE" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".75">
      <path d="M172 84 Q188 74 206 74" />
      <path d="M212 77 Q228 83 237 97" />
    </g>

    <g stroke="#FFFFFF" stroke-width="4.5" fill="none" stroke-linecap="round">
      <path d="M170 104 Q180 99 190 102" />
      <path d="M210 102 Q220 99 230 104" />
    </g>

    <!-- glasses -->
    <g fill="#FFFFFF" fill-opacity=".2" stroke="#3D2A17" stroke-width="5.5" stroke-linecap="round">
      <rect x="163" y="110" width="34" height="28" rx="14" />
      <rect x="203" y="110" width="34" height="28" rx="14" />
      <path d="M197 123 h6" fill="none" />
      <path d="M163 117 L151 121" fill="none" />
      <path d="M237 117 L249 121" fill="none" />
    </g>

    <g fill="none" stroke="#3D2A17" stroke-width="3.6" stroke-linecap="round">
      <path d="M172 126 q8 -7 16 0" />
      <path d="M212 126 q8 -7 16 0" />
    </g>

    <g fill="#E8A87C" opacity=".4">
      <ellipse cx="168" cy="142" rx="11" ry="6" />
      <ellipse cx="232" cy="142" rx="11" ry="6" />
    </g>
  </g>

  <!-- bottom chevron, drawn before the banner so the banner overlaps it -->
  <path d="M142 322 L258 322 L200 378 Z" fill="#FFFFFF" />
  <path d="M152 326 L248 326 L200 368 Z" fill="#4A2A15" />
  <path d="M166 330 L234 330 L200 356 Z" fill="#F2921D" />

  <!-- banner -->
  <rect x="18" y="234" width="364" height="106" rx="26" fill="#FFFFFF" />
  <rect x="24" y="240" width="352" height="94" rx="21" fill="#4A2A15" />
  <rect x="32" y="248" width="336" height="78" rx="15" fill="none" stroke="#FFFFFF" stroke-width="2.6" />

  <!-- wordmark: sized to sit inside the 336px inner banner -->
  <circle cx="50" cy="281" r="4.5" fill="#F2921D" />
  <circle cx="350" cy="281" r="4.5" fill="#F2921D" />
  <text
    x="200" y="291"
    text-anchor="middle"
    font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif"
    font-size="36" font-weight="700" letter-spacing="-0.6"
  ><tspan fill="#FFFFFF">Travel</tspan><tspan fill="#F2921D">On</tspan><tspan fill="#FFFFFF">Buddy</tspan></text>

  <rect x="88" y="300" width="224" height="2" rx="1" fill="#FFFFFF" opacity=".5" />
  <rect x="64" y="313" width="18" height="2.6" rx="1.3" fill="#F2921D" />
  <rect x="318" y="313" width="18" height="2.6" rx="1.3" fill="#F2921D" />
  <text
    x="200" y="318"
    text-anchor="middle"
    font-family="'Segoe UI', Tahoma, Verdana, sans-serif"
    font-size="10.5" font-weight="600" letter-spacing="0.7" fill="#FFFFFF"
  >TRAVEL TOGETHER, TRAVEL BETTER</text>
</svg>
