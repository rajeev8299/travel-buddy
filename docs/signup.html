<!doctype html>
<html lang="en">

    <link rel="stylesheet" href="css/styles.css" />

  <body>
    <div class="page">
      <div id="site-header"></div>

      <main>
        <div
          id="page-header-slot"
          data-eyebrow="Sign up"
          data-title="Create your account"
          data-intro="A few details and you're in. You can finish your profile whenever — we won't block the fun parts on paperwork."
          data-image="img/harbour.jpg"
          data-pos="center 50%"
        ></div>

        <section class="section section--tint">
          <div class="shell auth__shell" data-reveal>
            <div id="auth-form-slot"></div>
          </div>
        </section>
      </main>

      <div id="site-footer"></div>
    </div>

    <script src="js/util.js"></script>
    <script src="js/api.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/page-header.js"></script>
    <script src="js/auth.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        initReveal();
        initAuthForm("signup");
      });
    </script>
    <script src="js/pwa.js"></script>
  </body>
