<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="apple-touch-icon" href="logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Log in to TravelOnBuddy — pick up your saved trips, draft plans, and buddy chats." />
    <meta name="theme-color" content="#3F2617" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Log In — TravelOnBuddy</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="page">
      <div id="site-header"></div>

      <main>
        <div
          id="page-header-slot"
          data-eyebrow="Log in"
          data-title="Welcome back"
          data-intro="Pick up where you left off — your saved trips, draft plans and the buddies you've been chatting with are all here."
          data-image="img/riverfront.jpg"
          data-pos="center 55%"
        ></div>

        <section class="section">
          <div class="shell auth__shell" data-reveal>
            <div id="auth-form-slot"></div>
          </div>
        </section>
      </main>

      <div id="site-footer"></div>
    </div>

    <script src="js/util.js"></script>
    <script src="js/api.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/page-header.js"></script>
    <script src="js/auth.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        initReveal();
        initAuthForm("login");
      });
    </script>
  </body>
</html>
