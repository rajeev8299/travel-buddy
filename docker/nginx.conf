# Admin panel only. The old static site (docs/) is retired: anything outside
# /admin/ is sent to the Next.js site, which redirects old .html addresses to
# their new pages. ${SITE_URL} is filled in at container start (nginx image
# templates); nginx's own $variables are left alone.
server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;
  # Relative Location headers, so redirects keep whatever host and port the visitor used.
  absolute_redirect off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = / {
    return 302 /admin/;
  }

  location / {
    return 301 ${SITE_URL}$request_uri;
  }

  # The admin panel must never be framed by another site (clickjacking its
  # approve/delete buttons). add_header in a location replaces the server-
  # level ones, so they're repeated here.
  location /admin/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/ /admin/index.html;
  }
}
